# Тест-стенд yu-club (S0-19): api + postgres:16. Наружу порты не публикуются –
# вход только через общий Caddy сервера (внешняя сеть CADDY_NETWORK, блок deploy/Caddyfile.yu-club).
# Пароли и пути – из файла окружения вне репозитория:
#   docker compose --env-file /opt/yu-club/.env -f deploy/compose.yml up -d
# Миграции под yu_owner: docker compose ... run --rm migrate
# Ресурсы сервера малы: у Postgres маленькие буферы, у контейнеров лимиты памяти.
name: yu-club
services:
  postgres:
    image: postgres:16-alpine
    container_name: yu-club-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD}
      # для deploy/initdb/01-roles.sh (выполняется один раз, на пустом каталоге данных)
      YU_OWNER_PASSWORD: ${YU_OWNER_PASSWORD:?нет YU_OWNER_PASSWORD}
      YU_APP_PASSWORD: ${YU_APP_PASSWORD:?нет YU_APP_PASSWORD}
      YU_BOSS_PASSWORD: ${YU_BOSS_PASSWORD:?нет YU_BOSS_PASSWORD}
      TZ: UTC
    command: >-
      postgres -c shared_buffers=32MB -c effective_cache_size=128MB -c work_mem=2MB
      -c maintenance_work_mem=16MB -c max_connections=30 -c max_wal_size=256MB
    volumes:
      - ${DATA_DIR:-/opt/yu-club/data}:/var/lib/postgresql/data
      # бэкапы (deploy/backup.sh): pg_dump пишет сюда изнутри контейнера
      - ${BACKUP_DIR:-/opt/yu-club/backups}:/backups
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    shm_size: 64m
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yu_club"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    image: yu-club-api:local
    profiles: [migrate]
    command: ["node", "db/migrate.ts", "up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://yu_owner:${YU_OWNER_PASSWORD}@postgres:5432/yu_club
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 128m
    networks: [internal]
    logging: *log

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: yu-club-api:local
    container_name: yu-club-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-stage}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://yu_app:${YU_APP_PASSWORD}@postgres:5432/yu_club
      # секрет HMAC сессий сотрудников (K12): генерирует deploy.sh один раз на сервере, значения в репо нет
      SESSION_PEPPER: ${SESSION_PEPPER:?нет SESSION_PEPPER}
      # пара VAPID для Web Push (S1-15): тоже генерирует deploy.sh один раз
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?нет VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?нет VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?нет VAPID_SUBJECT}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1,172.16.0.0/12}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 160m
    networks: [internal, caddy]
    logging: *log

  # Фоновый процесс (apps/api/src/worker.ts): outbox через pg-boss, истечение удержаний, диспетчер уведомлений.
  # Тот же образ, что api, другая команда; входящих маршрутов нет.
  worker:
    image: yu-club-api:local
    container_name: yu-club-worker
    restart: unless-stopped
    command: ["node", "apps/api/src/worker.ts"]
    environment:
      APP_ENV: ${APP_ENV:-stage}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://yu_app:${YU_APP_PASSWORD}@postgres:5432/yu_club
      # pg-boss: роль yu_boss – владелец только схемы pgboss (ADR 0001)
      PGBOSS_DATABASE_URL: postgres://yu_boss:${YU_BOSS_PASSWORD}@postgres:5432/yu_club
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?нет VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?нет VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?нет VAPID_SUBJECT}
    depends_on:
      postgres: { condition: service_healthy }
    # HTTP-проверки у процесса нет – отключаем унаследованный от образа HEALTHCHECK на /health
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: 128m
    # caddy-сеть – единственный выход наружу (push-сервисы); входящих маршрутов на worker нет
    networks: [internal, caddy]
    logging: *log

  # CRM (S0-14/15): Astro SSR; браузер ходит только в CRM, та проксирует /api/crm/v1/* в API по внутренней сети.
  crm:
    build:
      context: ..
      dockerfile: apps/crm/Dockerfile
    image: yu-club-crm:local
    container_name: yu-club-crm
    restart: unless-stopped
    environment:
      API_URL: ${CRM_API_URL:-http://yu-club-api:3000}
      # Caddy общего сервера приходит из сети Docker – его X-Forwarded-For принимаем (lib/client-ip.ts)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1,172.16.0.0/12}
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 192m
    networks: [internal, caddy]
    logging: *log

  # Публичный сайт (S1-18+): Astro SSR, данные сети – из API на сервере (API_URL), браузер в API ходит
  # через прокси сайта (/api/public/v1/*). APP_ENV не prod – noindex на всём и robots.txt Disallow: /.
  site:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
    image: yu-club-site:local
    container_name: yu-club-site
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-stage}
      API_URL: ${SITE_API_URL:-http://yu-club-api:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # прокси /api/public/v1/* сайта: X-Forwarded-For принимаем только от Caddy (сети Docker)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1,172.16.0.0/12}
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 160m
    networks: [internal, caddy]
    logging: *log

networks:
  internal:
    name: yu-club-internal
    internal: true
  caddy:
    name: ${CADDY_NETWORK:-dzenbot_default}
    external: true
