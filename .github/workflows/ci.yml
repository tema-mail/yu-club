name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Одноразовый кластер CI, наружу не торчит – не секрет.
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Хелпер тестов берёт TEST_DATABASE_URL вместо embedded-postgres (tests/helpers/pg.ts).
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      # Тесты гонок открывают ~52 соединения в параллельных файлах, у образа по умолчанию 100.
      # Сервисам Actions нельзя задать command – поднимаем через ALTER SYSTEM и перезапуск контейнера.
      - name: postgres max_connections = 300
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break; sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -Atc "SHOW max_connections" | grep -qx 300
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Новая миграция старше всех в базе слияния – иначе раннер отвергнет её на стенде (0440 → 0447 → 0450).
      - name: порядок миграций
        run: scripts/check-migration-order.sh ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Caddyfile проекта – тем же разбором, что на сервере (10.11: «handle» с двумя путями прошёл тесты, но Caddy отверг блок при выкладке)
      - name: Caddyfile проходит caddy adapt
        run: docker run --rm -v "$PWD/deploy:/d:ro" caddy:2 caddy adapt --config /d/Caddyfile.yu-club --adapter caddyfile > /dev/null
      - run: npm run build:crm
      - run: npm run build:site
      - run: npm test

  crm-e2e:
    # CRM на моке API (apps/crm/tests/mock-api.ts): база и бэкенд не нужны.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/crm
      - run: npm run test:crm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crm-playwright
          path: apps/crm/test-results/
          retention-days: 7

  site-e2e:
    # Сайт на моке публичного API (apps/site/tests/mock-api.ts): база и бэкенд не нужны.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/site
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-playwright
          path: apps/site/test-results/
          retention-days: 7
