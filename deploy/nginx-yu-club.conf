# yu-club: http → https кодом 301 (Caddy на 443, порт 80 у nginx ispmanager). Ставит deploy/deploy.sh в /etc/nginx/conf.d/yu-club.conf.
# Именно 301, а не 308: Яндекс не склеивает зеркала по 308. Адреса заменяются по YU_DOMAIN / YU_CRM_DOMAIN.
server {
  listen 80;
  listen [::]:80;
  server_name yu-club.168.113.179.49.nip.io;
  location /.well-known/acme-challenge/ { return 404; }
  location / { return 301 https://yu-club.168.113.179.49.nip.io$request_uri; }
}
server {
  listen 80;
  listen [::]:80;
  server_name yu-crm.168.113.179.49.nip.io;
  location /.well-known/acme-challenge/ { return 404; }
  location / { return 301 https://yu-crm.168.113.179.49.nip.io$request_uri; }
}
